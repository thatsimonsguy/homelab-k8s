apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-mcp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/thatsimonsguy/homelab-k8s.git'
    targetRevision: main
    path: 'apps/media-mcp'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'media-mcp'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
