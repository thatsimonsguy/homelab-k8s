apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bright-badger-site
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/thatsimonsguy/homelab-k8s'
    targetRevision: main
    path: apps/bright-badger-site
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true