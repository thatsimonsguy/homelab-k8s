apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flaresolverr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/thatsimonsguy/homelab-k8s.git'
    targetRevision: main
    path: 'apps/flaresolverr'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'jackett'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
