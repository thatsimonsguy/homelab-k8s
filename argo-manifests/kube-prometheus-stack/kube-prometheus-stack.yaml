apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thatsimonsguy/homelab-k8s.git
    targetRevision: main
    path: apps/kube-prometheus-stack
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # The 6 large CRDs (alertmanagers, prometheuses, etc.) exceed kubectl's
  # 262KB annotation limit. We manage them via `kubectl apply --server-side`
  # outside ArgoCD and tell ArgoCD to stop diffing them.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: alertmanagerconfigs.monitoring.coreos.com
      jsonPointers: [/spec, /status]
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: alertmanagers.monitoring.coreos.com
      jsonPointers: [/spec, /status]
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: prometheusagents.monitoring.coreos.com
      jsonPointers: [/spec, /status]
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: prometheuses.monitoring.coreos.com
      jsonPointers: [/spec, /status]
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: scrapeconfigs.monitoring.coreos.com
      jsonPointers: [/spec, /status]
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: thanosrulers.monitoring.coreos.com
      jsonPointers: [/spec, /status]
