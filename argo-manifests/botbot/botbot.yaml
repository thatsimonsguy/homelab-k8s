apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: botbot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thatsimonsguy/homelab-k8s
    targetRevision: main
    path: apps/botbot
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true