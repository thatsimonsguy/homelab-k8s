apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-edge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thatsimonsguy/homelab-k8s.git
    targetRevision: main
    path: apps/traefik-edge
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
