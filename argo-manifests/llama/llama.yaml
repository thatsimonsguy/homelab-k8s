apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llama
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thatsimonsguy/homelab-k8s.git
    targetRevision: main
    path: apps/llama
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  # planet scales llama-solo / llama-rpc to switch modes; don't fight it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: llama-solo
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: llama-rpc
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
