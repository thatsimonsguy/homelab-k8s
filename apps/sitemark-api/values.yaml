replicaCount: 1

image:
  repository: 192.168.2.17:5000/sitemark-backend
  tag: 0.2.25
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  class: traefik
  host: api.sitemark.app
  path: /
  pathType: Prefix

# Database configuration
postgres:
  host: 192.168.2.20
  port: 5432
  database: sitemarkdb
  user: sitemark_service
  sslmode: disable
  passwordSecretName: sitemark-db-secret
  passwordSecretKey: password

# Application configuration
app:
  port: 8080
  logLevel: debug

# Authentication configuration
auth:
  frontendUrl: https://sitemark.app
  jwtAccessTokenExpiry: 1h
  jwtRefreshTokenExpiry: 720h
  oauth:
    google:
      redirectUrl: https://api.sitemark.app/auth/callback/google
    microsoft:
      redirectUrl: https://api.sitemark.app/auth/callback/microsoft
  # Secrets stored in sealed secret
  secretsSecretName: sitemark-auth-secret

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
