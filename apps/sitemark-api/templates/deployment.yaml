apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sitemark-api.fullname" . }}
  namespace: sitemark-api
  labels:
    {{- include "sitemark-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "sitemark-api.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "sitemark-api.name" . }}
        app.kubernetes.io/name: {{ include "sitemark-api.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: sitemark-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ENV
              value: production
            - name: PORT
              value: "{{ .Values.app.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel }}
            - name: DB_HOST
              value: {{ .Values.postgres.host }}
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
            - name: DB_NAME
              value: {{ .Values.postgres.database }}
            - name: DB_USER
              value: {{ .Values.postgres.user }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecretName }}
                  key: {{ .Values.postgres.passwordSecretKey }}
            - name: DB_SSLMODE
              value: {{ .Values.postgres.sslmode | default "disable" }}
            # Authentication configuration
            - name: FRONTEND_URL
              value: {{ .Values.auth.frontendUrl }}
            - name: JWT_ACCESS_TOKEN_EXPIRY
              value: {{ .Values.auth.jwtAccessTokenExpiry }}
            - name: JWT_REFRESH_TOKEN_EXPIRY
              value: {{ .Values.auth.jwtRefreshTokenExpiry }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretsSecretName }}
                  key: jwt-secret
            # OAuth Google configuration
            - name: OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretsSecretName }}
                  key: google-client-id
            - name: OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretsSecretName }}
                  key: google-client-secret
            - name: OAUTH_GOOGLE_REDIRECT_URL
              value: {{ .Values.auth.oauth.google.redirectUrl }}
            # OAuth Microsoft configuration (placeholders)
            - name: OAUTH_MICROSOFT_CLIENT_ID
              value: "your_microsoft_client_id"
            - name: OAUTH_MICROSOFT_CLIENT_SECRET
              value: "your_microsoft_client_secret"
            - name: OAUTH_MICROSOFT_REDIRECT_URL
              value: {{ .Values.auth.oauth.microsoft.redirectUrl }}
            # OAuth Okta configuration (placeholders)
            - name: OAUTH_OKTA_CLIENT_ID
              value: "your_okta_client_id"
            - name: OAUTH_OKTA_CLIENT_SECRET
              value: "your_okta_client_secret"
            - name: OAUTH_OKTA_DOMAIN
              value: {{ .Values.auth.oauth.okta.domain }}
            - name: OAUTH_OKTA_REDIRECT_URL
              value: {{ .Values.auth.oauth.okta.redirectUrl }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
