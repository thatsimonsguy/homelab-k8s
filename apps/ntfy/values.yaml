image:
  repository: binwiederhier/ntfy
  tag: v2.11.0
  pullPolicy: IfNotPresent

# Internal only (LAN / VPN), behind traefik. Auth is deny-all by default:
# users, topic grants and publish tokens are created imperatively —
#   kubectl -n ntfy exec deploy/ntfy -- ntfy user add --role=user matt
#   kubectl -n ntfy exec deploy/ntfy -- ntfy access matt 'aggsys-*' ro
#   kubectl -n ntfy exec deploy/ntfy -- ntfy user add nightly; ntfy token add nightly; ntfy access nightly aggsys-sandbox wo
# The user database lives on the PVC.
host: ntfy.int.matthewpsimons.com
baseUrl: http://ntfy.int.matthewpsimons.com

storage:
  className: local-path
  size: 1Gi

resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { memory: 128Mi }
