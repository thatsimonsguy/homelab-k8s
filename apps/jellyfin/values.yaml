replicaCount: 1

image:
  repository: linuxserver/jellyfin
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8096
  loadBalancerIP: 192.168.2.27

persistence:
  config:
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: "nas-config-storage"
    mountPath: /config

volumes:
  tv:
    hostPath: /mnt/nas/tv
    mountPath: /mnt/nas/tv
  movies:
    hostPath: /mnt/nas/movies
    mountPath: /mnt/nas/movies

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Chicago"
  # Pin to GTX 960 (GPU 1), reserving GTX 1080 Ti (GPU 0) for LLM workloads
  NVIDIA_VISIBLE_DEVICES: "GPU-f8384aa9-fe44-7c37-aa19-9b18a97cd313"

gpu:
  enabled: true
