minio:
  auth:
    existingSecret: minio-secret  # created out-of-band (root-user/root-password keys)
  mode: standalone
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.2.21
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
