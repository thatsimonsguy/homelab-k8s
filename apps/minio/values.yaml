# MinIO, standalone (one drive), built from upstream source by image/Dockerfile
# (AGG-393). Replaced the bitnami subchart + frozen bitnamilegacy/minio image:
# MinIO no longer publishes community binaries or images, and Bitnami froze
# theirs. Resource names, selector labels and the PVC are the ones the bitnami
# chart created, so the upgrade reuses the existing volume in place.
image:
  repository: 192.168.2.17:5000/minio
  tag: RELEASE.2025-10-15T17-29-55Z
  # Pinned: the digest `docker push` printed for the tag above. When set it
  # wins over the tag.
  digest: sha256:61e6f930718a55daf3e1a96e784553467295eb575e4b2a111a451e7a7b3c9eee
  pullPolicy: IfNotPresent

auth:
  existingSecret: minio-secret  # created out-of-band (root-user/root-password keys)

# Built-in single-key KMS, required for SSE-S3 bucket encryption (aggsys
# document storage, design D8 / AGG-466). Off until the secret exists. The
# key ("<name>:<base64 32 bytes>") must also be kept OUTSIDE the cluster:
# objects and IAM data encrypted under it are unreadable without it.
kms:
  enabled: false
  existingSecret: minio-kms
  secretKey: kms-secret-key

service:
  type: ClusterIP  # AGG-377 D4: no LAN address; dev access via scripts/dev/homelab-tunnel.sh (aggsys repo)
  apiPort: 9000
  consolePort: 9001

persistence:
  # The bitnami chart's PVC (bound to a Retain local-path PV). Size may grow,
  # never shrink; the claim is kept if the chart is ever deleted.
  size: 20Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
