minio:
  image:
    # Bitnami purged versioned tags from docker.io/bitnami in 2024; the
    # frozen archive lives under bitnamilegacy.
    repository: bitnamilegacy/minio
  auth:
    existingSecret: minio-secret  # created out-of-band (root-user/root-password keys)
  mode: standalone
  service:
    type: ClusterIP  # AGG-377 D4: no LAN address; dev access via scripts/dev/homelab-tunnel.sh (aggsys repo)
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
