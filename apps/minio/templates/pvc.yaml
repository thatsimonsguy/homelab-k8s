# The existing claim (created by the bitnami chart, 2026-07). Same name and
# spec, so the upgrade adopts it; never pruned or deleted with the app.
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
