image: 192.168.2.17:5000/traceroute:0.1.67
maintenance:
  enabled: true
  suspend: false
# Daily feedback digest (ADR-0025). Enable only once the sealed digest credential
# exists and the role has been configured; see provisioning/traceroute-postgres/README.md.
feedbackDigest:
  enabled: true
  suspend: false
backup:
  enabled: true
  image: 192.168.2.17:5000/traceroute-backup:0.1.37
  bucket: ismatthealthy-trial-backups-881792194126-us-east-2
  expectedAccount: '881792194126'
  journalID: 6018a1fc-fbc1-47b0-b3e2-9aa0397aa750
publication:
  enabled: true
  bucket: ismatthealthy-trial-journal-881792194126-us-east-2
# Observability (TRA-4). The listener's second port serves /metrics and the
# probes; it is bound inside the pod and is never routed through the tunnel, so
# the public surface stays the product and its publications alone (ADR-0018).
# Nothing it publishes carries a workspace, view or publication identifier.
observability:
  enabled: true
  port: 9090
  interval: 30s
  # Alerts land in Alertmanager labelled team=traceroute. They go no further
  # Routed from there to the ntfy topic traceroute-alerts (apps/kube-prometheus-stack).
  rules: true
  dashboard: true
