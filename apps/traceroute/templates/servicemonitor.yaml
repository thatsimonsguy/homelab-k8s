{{- if .Values.observability.enabled }}
# Scrape the operations port only (TRA-4). The product port serves the record and
# the publications and is never scraped; nothing in the exposed series carries a
# workspace, view or publication identifier, so a scrape cannot be joined to
# health data. Picked up by the kube-prometheus-stack operator through the
# release label, the same way the aggsys rules are.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traceroute
  namespace: traceroute
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [traceroute]
  selector:
    matchLabels: {app: traceroute}
  endpoints:
    - port: ops
      path: /metrics
      scheme: http
      interval: {{ .Values.observability.interval }}
      scrapeTimeout: 10s
{{- end }}
