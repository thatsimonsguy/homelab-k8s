{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: traceroute-database-backup
  namespace: traceroute
spec:
  schedule: "37 7 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: traceroute-database-backup}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: {{ .Values.backup.image | quote }}
              imagePullPolicy: IfNotPresent
              command: [traceroute-backup]
              envFrom:
                - secretRef: {name: traceroute-backup-databases}
                - secretRef: {name: traceroute-aws-backup-writer}
                - secretRef: {name: traceroute-maintenance-alerts}
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef: {fieldPath: metadata.name}
                - {name: TMPDIR, value: /tmp}
                - name: TRACEROUTE_BACKUP_BUCKET
                  value: {{ .Values.backup.bucket | quote }}
                - name: TRACEROUTE_BACKUP_EXPECTED_ACCOUNT
                  value: {{ .Values.backup.expectedAccount | quote }}
                - name: TRACEROUTE_JOURNAL_ID
                  value: {{ .Values.backup.journalID | quote }}
              volumeMounts:
                - {name: temporary, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 256Mi}
                limits: {cpu: '1', memory: 512Mi, ephemeral-storage: 3Gi}
          volumes:
            - name: temporary
              emptyDir: {sizeLimit: 2300Mi}
{{- end }}
