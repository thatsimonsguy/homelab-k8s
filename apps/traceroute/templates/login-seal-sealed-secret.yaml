# The key that seals the pending-login cookie (ADR-0013 amendment 2026-09-17, TRA-31).
# A cluster secret rather than a per-process one, so a sign-in in flight survives a deploy.
# Rotating it invalidates only pending logins; a reload starts a fresh one.
# 32 random bytes, base64. Sealed strict to traceroute/traceroute-login-seal.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: traceroute-login-seal
  namespace: traceroute
spec:
  template:
    metadata:
      name: traceroute-login-seal
      namespace: traceroute
    type: Opaque
  encryptedData:
    TRACEROUTE_LOGIN_SEAL_KEY: 
