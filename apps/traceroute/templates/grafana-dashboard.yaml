{{- if .Values.observability.dashboard }}
# The Traceroute board (TRA-4). The kube-prometheus-stack Grafana sidecar imports
# any ConfigMap in any namespace carrying grafana_dashboard: "1". The JSON is kept
# beside the chart rather than inline so Grafana's {{ "{{" }}label{{ "}}" }} legends
# need no escaping; .Files.Get copies it verbatim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traceroute-dashboard
  namespace: traceroute
  labels:
    grafana_dashboard: "1"
    app: traceroute
data:
  traceroute.json: |
{{ .Files.Get "dashboards/traceroute.json" | indent 4 }}
{{- end }}
