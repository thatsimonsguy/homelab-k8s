apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceroute
  namespace: traceroute
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: traceroute}
  template:
    metadata:
      labels: {app: traceroute}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: traceroute
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.publication.enabled }}
          args:
            - -listen
            - 0.0.0.0:8090
            - -publication-journal-bucket
            - {{ required "publication.bucket is required" .Values.publication.bucket | quote }}
            - -publication-journal-account
            - {{ required "backup.expectedAccount is required" .Values.backup.expectedAccount | quote }}
            - -publication-journal-id
            - {{ required "backup.journalID is required" .Values.backup.journalID | quote }}
          {{- end }}
          envFrom:
            - secretRef: {name: traceroute-runtime}
            {{- if .Values.publication.enabled }}
            - secretRef: {name: traceroute-aws-journal-writer}
            {{- end }}
          ports:
            - {name: http, containerPort: 8090}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: traceroute
  namespace: traceroute
spec:
  selector: {app: traceroute}
  ports:
    - {name: http, port: 8090, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traceroute
  namespace: traceroute
spec:
  entryPoints: [web]
  routes:
    - match: Host(`app.traceroutehealth.com`)
      kind: Rule
      services:
        - {name: traceroute, port: 8090}
