apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceroute
  namespace: traceroute
spec:
  # Zero while the service is paused: the AWS cutover's write pause, and the stopped-not-
  # deleted copy kept through the rollback window (ADR-0031). `default` would turn 0 into 1.
  replicas: {{ if hasKey .Values "replicas" }}{{ .Values.replicas }}{{ else }}1{{ end }}
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: traceroute}
  template:
    metadata:
      labels: {app: traceroute}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: traceroute
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - -listen
            - 0.0.0.0:8090
            {{- if .Values.observability.enabled }}
            # The operations port serves /metrics and the probes. It is bound to
            # the pod only: the IngressRoute below routes the product port alone,
            # and the tunnel never sees this one (TRA-4).
            - -ops-listen
            - 0.0.0.0:{{ .Values.observability.port }}
            {{- end }}
            {{- if .Values.publication.enabled }}
            - -publication-journal-bucket
            - {{ required "publication.bucket is required" .Values.publication.bucket | quote }}
            - -publication-journal-account
            - {{ required "backup.expectedAccount is required" .Values.backup.expectedAccount | quote }}
            - -publication-journal-id
            - {{ required "backup.journalID is required" .Values.backup.journalID | quote }}
          {{- end }}
          envFrom:
            - secretRef: {name: traceroute-runtime}
            # Seals the pending-login cookie so an anonymous page view allocates no
            # server-side session (ADR-0013 amendment, TRA-31).
            - secretRef: {name: traceroute-login-seal}
            {{- if .Values.publication.enabled }}
            - secretRef: {name: traceroute-aws-journal-writer}
            {{- end }}
          ports:
            - {name: http, containerPort: 8090}
            {{- if .Values.observability.enabled }}
            - {name: ops, containerPort: {{ .Values.observability.port }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if .Values.observability.enabled }}
          # Liveness answers for the process alone: a database outage must not
          # restart the pod. Readiness answers for the database too, so a pod that
          # cannot serve the record leaves the Service until it can.
          # Startup answers for the database, so a new pod takes no traffic until the
          # record is reachable. Readiness answers for the process, so a later Postgres
          # blip leaves the app in service showing its own error instead of handing
          # callers a bare gateway error from Traefik. Liveness never restarts for a
          # dependency.
          startupProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 20
          {{- else }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          {{- end }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: traceroute
  namespace: traceroute
  labels: {app: traceroute}
spec:
  selector: {app: traceroute}
  ports:
    - {name: http, port: 8090, targetPort: http}
    {{- if .Values.observability.enabled }}
    - {name: ops, port: {{ .Values.observability.port }}, targetPort: ops}
    {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traceroute
  namespace: traceroute
spec:
  entryPoints: [web]
  routes:
    - match: Host(`app.traceroutehealth.com`)
      kind: Rule
      services:
        - {name: traceroute, port: 8090}
