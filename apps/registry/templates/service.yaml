apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: kube-system
spec:
  type: { { .Values.service.type } }
  loadBalancerIP: { { .Values.service.loadBalancerIP } }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    app: registry
