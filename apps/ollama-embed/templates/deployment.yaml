apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embed
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ollama-embed
  template:
    metadata:
      labels:
        app: ollama-embed
    spec:
      {{- if .Values.gpu.enabled }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      initContainers:
        - name: pull-embedding-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ollama", "pull", "nomic-embed-text"]
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.persistence.mountPath }}
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ollama-embed-model-cache