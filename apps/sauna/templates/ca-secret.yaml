# Client-cert CA for mTLS. This is the PUBLIC CA certificate only (no private
# key) — it is not sensitive, so a plain Secret is fine (no sealing needed).
# Traefik reads the CA from the `tls.ca` key (see the TLSOption below).
apiVersion: v1
kind: Secret
metadata:
  name: sauna-client-ca
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  tls.ca: {{ .Files.Get "files/ca.crt" | b64enc }}
