apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  type: "{{ .Values.service.type }}"
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  ports:
  - port: 8123
    targetPort: 8123
    protocol: TCP
    name: http
  selector:
    app: home-assistant
