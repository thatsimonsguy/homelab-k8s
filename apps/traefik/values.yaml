image:
  repository: traefik
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.2.15

ingressRoute:
  dashboard:
    enabled: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "placeholder@placeholder.com"
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true

rbac:
  enabled: true

deployment:
  enabled: true
