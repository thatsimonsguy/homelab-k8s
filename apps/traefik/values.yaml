
deployment:
  enabled: true

ingressRoute:
  dashboard:
    enabled: true

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.2.15

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "dontspammebro@notreal.com"
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true
