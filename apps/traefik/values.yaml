image:
  repository: traefik
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.2.16

ingressRoute:
  dashboard:
    enabled: true

providers:
  kubernetesIngress:
    enabled: true
    namespaces: []
  kubernetesCRD:
    enabled: true
    namespaces: []

ingressClass:
  enabled: true
  isDefaultClass: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "placeholder@placeholder.com"
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web
      tlsChallenge: {}

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: "default"
  path: "/data"

ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true

rbac:
  enabled: true

deployment:
  enabled: true
