apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups:
      - ""
      - extensions
      - networking.k8s.io
    resources:
      - services
      - endpoints
      - secrets
      - ingressclasses
      - ingresses
    verbs:
      - get
      - list
      - watch
