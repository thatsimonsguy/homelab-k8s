replicaCount: 1

image:
  repository: ghcr.io/flaresolverr/flaresolverr
  tag: v3.5.2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8191

# Headless Chrome: needs headroom, spikes during challenge solves
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

env:
  LOG_LEVEL: info
  TZ: "Etc/UTC"
