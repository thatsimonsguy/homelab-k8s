apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: plex-route
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.local`)
      kind: Rule
      middlewares:
        - name: plex-headers
        - namespace: default
      services:
        - name: plex-plex-media-server
          port: 32400
  tls:
    certResolver: letsencrypt