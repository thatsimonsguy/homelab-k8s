image:
  repository: ollama/ollama
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: LoadBalancer
  port: 11434
  loadBalancerIP: 192.168.2.21

persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path
  mountPath: /root/.ollama

gpu:
  enabled: true

env:
  # Pin to GTX 1080 Ti (GPU 0), reserving GTX 960 (GPU 1) for Jellyfin
  NVIDIA_VISIBLE_DEVICES: "GPU-a0588968-f48e-059d-e0d7-9be4dfe1bbee"

model:
  pull: qwen2.5:14b
