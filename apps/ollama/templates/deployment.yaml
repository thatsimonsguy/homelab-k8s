apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      {{- if .Values.gpu.enabled }}
      runtimeClassName: nvidia
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 11434
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "{{ .Values.env.NVIDIA_VISIBLE_DEVICES }}"
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.persistence.mountPath }}
          {{- if .Values.gpu.enabled }}
          resources:
            limits:
              nvidia.com/gpu: 1
          {{- end }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    until ollama list >/dev/null 2>&1; do sleep 2; done
                    ollama pull {{ .Values.model.pull }}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ollama-model-cache
