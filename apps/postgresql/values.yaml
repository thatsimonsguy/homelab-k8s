image:
  tag: "16.2.0-debian-11-r0"  # Latest as of now from Bitnami

postgresql:
  auth:
    existingSecret: postgresql-secret
    database: "mydatabase"
    username: "myuser"
    forcePassword: true
  primary:
    service:
      type: LoadBalancer
      loadBalancerIP: 192.168.2.20
    # Explicit resources: chart 15.5.2 defaults unset resources to the
    # Bitnami "nano" preset (192Mi limit), which OOMKilled the pod 44+ times
    # under aggsys ETL/replay scans (2026-07-12). Node has ~32Gi at ~27% use.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    extendedConfiguration: |
      shared_preload_libraries = 'pg_stat_statements'
      pg_stat_statements.max = 10000
      pg_stat_statements.track = all
      shared_buffers = 512MB
