{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gotify
  namespace: gotify
spec:
  {{- if eq .Values.ingress.mode "tunnel" }}
  entryPoints: [web]
  {{- else }}
  entryPoints: [websecure]
  {{- end }}
  routes:
    # Public: message submission only (an app token in the request). The web UI, the
    # admin sign-in, the client API and the stream are not routed from this hostname.
    - match: Host(`{{ required "approved hostname required" .Values.ingress.host }}`) && Path(`/message`) && Method(`POST`)
      kind: Rule
      services:
        - {name: gotify, port: 80}
  {{- if ne .Values.ingress.mode "tunnel" }}
  tls:
    secretName: {{ required "verified TLS secret required" .Values.ingress.tlsSecret }}
  {{- end }}
{{- end }}
