apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: gotify
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gotify}
  template:
    metadata:
      labels: {app: gotify}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gotify
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: GOTIFY_SERVER_PORT, value: "8080"}
            - {name: GOTIFY_REGISTRATION, value: "false"}
            - {name: GOTIFY_OIDC_ENABLED, value: "false"}
            - {name: GOTIFY_PLUGINSDIR, value: ""}
            - {name: GOTIFY_SERVER_SECURECOOKIE, value: "true"}
            - {name: GOTIFY_DATABASE_DIALECT, value: sqlite3}
            - {name: GOTIFY_DATABASE_CONNECTION, value: /app/data/gotify.db}
            - {name: GOTIFY_UPLOADEDIMAGESDIR, value: /app/data/images}
            - name: GOTIFY_DEFAULTUSER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrapSecret }}
                  key: username
            - name: GOTIFY_DEFAULTUSER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrapSecret }}
                  key: password
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gotify-data
