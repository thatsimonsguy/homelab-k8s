image:
  registry: 192.168.2.17:5000
  # Set both to the tag printed by `task sandbox-images` in the aggsys repo.
  erpServerTag: 20261028-15d62978
  toolsTag: 20261028-15d62978
  pullPolicy: Always

# Public, daytime erp-server: config-driven tax (TAX_PROVIDER unset), OIDC on.
erpServer:
  replicas: 1
  env:
    ENVIRONMENT: production
    LOG_LEVEL: info
    PORT: "8080"
    OIDC_ENABLED: "true"
    OIDC_ISSUER_URL: http://keycloak.int.matthewpsimons.com/realms/wieser
    OIDC_CLIENT_ID: erp-api
    OIDC_APP_CLIENT_ID: aggsys-app
    OIDC_AGENT_CLIENT_ID: aggsys-agent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

# The nightly from-zero rebuild (aggsys repo: deploy/sandbox/nightly.sh).
nightly:
  # Titan's own SQL full backup finishes ~02:05 Central (compressed since
  # 2026-09-06, so earlier from here on); start after it. If the file is
  # still being written, the fetch waits for it to settle (up to 45m).
  schedule: "30 2 * * *"
  timeZone: America/Chicago
  suspend: false
  activeDeadlineSeconds: 14400
  tenant: wieser
  tenantName: Wieser Concrete Products
  t0: "2026-01-01"
  replayPort: "8091"
  # Pin a backup file name to skip the pull (proof runs); empty = newest .bak on the Titan VM.
  bakFile: ""
  env:
    # Titan backup source: Bastion tunnel + SFTP pull as a read-only key
    # (titan-etl backup-sync; AZURE_* service principal + the private key in
    # the sealed secret). Quoin's only tie to Wieser's Azure.
    SANDBOX_VM_RG: rg-titan
    SANDBOX_VM_NAME: vm-sql-titan
    SANDBOX_BASTION_NAME: bastion-titan
    SANDBOX_SSH_USER: quoin-backup-ro
    SANDBOX_SSH_KEY_FILE: /etc/aggsys/secrets/SANDBOX_SSH_PRIVATE_KEY
    SANDBOX_SSH_KNOWN_HOST: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPOaSpjnAxNAWWUyuoVeZWXlmhWBXz86Kj4wvIN2aiD6"
    SANDBOX_VM_BACKUP_DIR: /F:/Titan/backups
    KEYCLOAK_URL: http://keycloak.int.matthewpsimons.com
    KEYCLOAK_REALM: wieser
    SANDBOX_IDENTITY_FILE: /etc/aggsys/identity.yaml
    SANDBOX_WAIVERS_FILE: /etc/aggsys/waivers/wieser-replay-waivers.json
    # Tenant configuration (AGG-361): tax strategy + CoA purpose defaults,
    # applied through the public API after every rebuild (nightly.tenantConfig).
    SANDBOX_TENANT_CONFIG_FILE: /etc/aggsys/tenant-config/tenant-config.yaml
    # Entity manifest (AGG-391/392): the tenant's legal entity model for the
    # ETL load, the replay plan and the config passes (nightly.entities).
    SANDBOX_ENTITY_MANIFEST_FILE: /etc/aggsys/entities/entities.yaml
    # Alerting + artifacts (AGG-362): the outcome line to ntfy (token in the
    # sealed secret), the night's record to MinIO (credentials likewise).
    NTFY_URL: http://ntfy.ntfy.svc.cluster.local/aggsys-sandbox
    SANDBOX_S3_URL: http://minio.minio.svc.cluster.local:9000
    SANDBOX_S3_BUCKET: aggsys-sandbox-reports
    SANDBOX_IDENTITY_CREDENTIALS: /data/identity-credentials.txt
    REPLAY_OIDC_TOKEN_URL: http://keycloak.int.matthewpsimons.com/realms/wieser/protocol/openid-connect/token
    REPLAY_OIDC_CLIENT_ID: erp-api
    REPLAY_ENTRY_USERNAME: replay-entry
    REPLAY_APPROVER_USERNAME: replay-approver
    OIDC_ISSUER_URL: http://keycloak.int.matthewpsimons.com/realms/wieser
    OIDC_CLIENT_ID: erp-api
  # Identity manifest (AGG-359): people, aggsys role, scope. Keycloak accounts
  # are ensured through the admin API (KEYCLOAK_ADMIN_* in the sealed secret);
  # a new local account's temporary password lands in
  # /data/identity-credentials.txt on the PVC (kubectl exec to read it).
  # What a controller sets on day one and the ETL leaves alone: the tax
  # calculation strategy (the public server is config-driven; tenant_rates
  # rides the Titan-migrated county rate tables) and the default revenue
  # account. Per-entity tax overrides for Trucking/Form go here once Wieser
  # decides them (G7 sign-off). Format: aggsys deploy/sandbox/tenant-config.example.yaml.
  # Entity manifest (AGG-391/392; aggsys deploy/sandbox/entities.example.yaml):
  # one entry per Titan company label. A company in the source that is not
  # listed here stops the nightly at the ETL load — verify it, add a line.
  entities: |
    # Entity manifest (AGG-391, docs/design/entity-birth-in-window-design.md D3):
    # the tenant's legal entity model, passed to `titan-etl load --entities`.
    # One entry per Titan company label (dbo.intercompany_company.company). The
    # facts — which plants belong to a company, its fiscal calendar, whether it
    # existed before T0 — come from the source data; this file holds only what a
    # person decides. A company in the source that is not listed here (or listed
    # here but absent from the source) stops the load: verify it and add a line.
    entities:
      - label: Form
        period_group: Form Fab        # gl_company_years.period_group spelling
        name: Wieser Form Fabrication
        cash_account: "1002"          # core.cash purpose default
        ic_account: "1230"            # the intercompany account named for this company
      - label: Main
        period_group: Main
        name: Wieser Concrete Products
        cash_account: "1000"
        ic_account: "1260"
      - label: Trucking
        period_group: Trucking
        name: Wieser Trucking
        cash_account: "1001"
        ic_account: "1250"
      - label: WW Leasing L           # WW Leasing LLC (plant 910), set up Sept 2026
        period_group: WW Leasing L
        name: WW Leasing LLC
        cash_account: "1015"
        party_account_policy: explicit
        # no ic_account: no intercompany account names it in the source data
    # Pending entities (entity-birth design D12): companies the source already
    # has GL / bank accounts for but no company, calendar or activity yet. Their
    # accounts are set aside while dormant; any activity on them, or the label
    # appearing as a source company, stops the load — then move the entry up to
    # `entities` (adding period_group, cash_account, ic_account/policy).
    pending:
      - label: NE Ohio Concrete       # acquisition (60% Wieser), expected close 2026-10-30/31; the label Titan will use is a guess
        name: NE Ohio Concrete
        cash_accounts: ["1018", "1019"] # 1018 Checking NE OH, 1019 MMA NE OH
  tenantConfig: |
    tax_strategy:
      tenant: tenant_rates
      legal_entities: {}
    purpose_defaults:
      - purpose: core.ar.revenue
        account: "4000"
      # CFO session 2026-10-28: purchase price variance is tracked, on 5150.
      # (GRNI on 2010 too, but 2010 isn't in the chart yet; add it once created.)
      - purpose: core.ap.ppv
        account: "5150"
    # CFO session 2026-10-28: anyone with a Wieser email signs in (role-less
    # until granted).
    allowed_email_domains: [wieserconcrete.com, wieserformfab.com]
    # Document-number prefixes (AGG-375) — Wieser's choice is still open; set
    # the keys here once decided (any subset of: ap_invoice ap_payment
    # ap_payment_run ap_credit_memo ap_debit_memo ap_prepayment ar_invoice
    # ar_credit_memo ar_debit_memo sales_order purchase_order delivery
    # delivery_return; "" = plain numeric series). Applied via
    # PATCH /api/v1/settings/document-numbering each night.
    # document_numbering:
    #   ar_invoice: "INV-"
    # Approval policy dial (AGG-353) — decision pending; example:
    # approval_policies:
    #   - { type: ap_invoice, require_sod: true, auto_approve_threshold: "2500" }
  identity: |
    # Realm security posture, re-applied every night (drift corrected).
    # Password rules bind at the next password change (first-login change
    # for new accounts); brute-force lockout is temporary, never permanent.
    realm:
      password_policy: "length(12) and notUsername and notEmail and passwordHistory(3)"
      brute_force: { enabled: true, failure_factor: 10, wait_increment_seconds: 60, max_failure_wait_seconds: 900 }
      sso_session_idle_seconds: 1800
      sso_session_max_seconds: 36000
      access_token_lifespan_seconds: 300
    users:
      - email: matt@brightbadgerstudios.com
        display_name: Matt Simons
        roles: [super_admin]
      - email: thatsimonsguy@gmail.com
        display_name: Matt Simons
        roles: [super_admin]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    memoryLimitMB: "5120"
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 6Gi }
    dataSizeLimit: 60Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }

# Secret `aggsys-sandbox-secrets` (sealed): DATABASE_URL, TITAN_SOURCE_URL (the ETL source database),
# REPLAY_STATE_URL, REPLAY_OIDC_CLIENT_SECRET, REPLAY_ENTRY_PASSWORD,
# REPLAY_APPROVER_PASSWORD, MSSQL_SA_PASSWORD, TREASURY_ENCRYPTION_KEY,
# KEYCLOAK_ADMIN_USER, KEYCLOAK_ADMIN_PASSWORD, AZURE_TENANT_ID, AZURE_CLIENT_ID,
# AZURE_CLIENT_SECRET, AZURE_SUBSCRIPTION_ID (sp-quoin-sandbox-nightly, Reader
# on the VM/NIC/Bastion only), SANDBOX_SSH_PRIVATE_KEY (the quoin-backup-ro key,
# a file). Re-seal with apps/aggsys/seal-secrets.sh <envfile> <keyfile>.
secretName: aggsys-sandbox-secrets

# Shared endpoints for the nightly and the backup job (AGG-362).
s3:
  url: http://minio.minio.svc.cluster.local:9000
ntfy:
  url: http://ntfy.ntfy.svc.cluster.local/aggsys-sandbox

# pg_dump of keycloak + replay_state to MinIO (bucket lifecycle: 14 days).
# After the nightly (02:30 + ~1h) so the run it captures is the night's.
backup:
  schedule: "30 4 * * *"
  timeZone: America/Chicago
  bucket: aggsys-backups

storage:
  className: local-path
  size: 80Gi
