# The nightly job restarts the public erp-server after the rebuild so its
# connection pool drops the schema `reset` replaced.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aggsys-nightly
  namespace: aggsys
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aggsys-nightly
  namespace: aggsys
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aggsys-nightly
  namespace: aggsys
subjects:
  - kind: ServiceAccount
    name: aggsys-nightly
    namespace: aggsys
roleRef:
  kind: Role
  name: aggsys-nightly
  apiGroup: rbac.authorization.k8s.io
