# Alertmanager backstop (AGG-362): a job that dies before it can notify, or
# a nightly that has not succeeded in a day and a half. Picked up by the
# kube-prometheus-stack operator through the release label; routed to ntfy
# by the aggsys route in that chart's Alertmanager config.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aggsys-sandbox
  namespace: aggsys
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: aggsys-sandbox
      rules:
        - alert: AggsysSandboxJobFailed
          expr: kube_job_status_failed{namespace="aggsys"} > 0
          for: 5m
          labels: { severity: critical, team: aggsys }
          annotations:
            summary: "aggsys job {{ "{{" }} $labels.job_name {{ "}}" }} failed"
            description: "A job in the aggsys namespace reported failure (the nightly rebuild or the backup). See kubectl -n aggsys get jobs."
        - alert: AggsysSandboxNightlyStale
          expr: (time() - max(kube_cronjob_status_last_successful_time{namespace="aggsys", cronjob="aggsys-nightly"})) > 36 * 3600
          for: 30m
          labels: { severity: warning, team: aggsys }
          annotations:
            summary: "aggsys nightly has not succeeded in 36 hours"
            description: "The Wieser sandbox is stale: no successful aggsys-nightly run in 36h."
        - alert: AggsysErpServerDown
          expr: kube_deployment_status_replicas_available{namespace="aggsys", deployment="aggsys-erp-server"} < 1
          for: 5m
          labels: { severity: critical, team: aggsys }
          annotations:
            summary: "aggsys-erp-server has no available replica"
            description: "The public Wieser sandbox API has had no ready pod for 5 minutes (readiness probe failing or the deployment scaled to zero). See kubectl -n aggsys get deploy,pods."
        - alert: AggsysEncryptedVolumeMissing
          expr: absent(node_filesystem_size_bytes{mountpoint="/srv/crypt/pgdata"}) or absent(node_filesystem_size_bytes{mountpoint="/srv/crypt/bulk"})
          for: 5m
          labels: { severity: critical, team: aggsys }
          annotations:
            summary: "an encrypted data volume is not mounted on burdturglar"
            description: "/srv/crypt/pgdata (Postgres) or /srv/crypt/bulk (MinIO + sandbox) is missing from the node exporter — most likely the Clevis/Tang unlock did not happen after a boot. Postgres, MinIO and the sandbox pods crash-loop on immutable empty directories until it is mounted. Unlock per apps/aggsys/RUNBOOK-encrypted-volumes.md (AGG-377)."

