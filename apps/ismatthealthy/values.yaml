# ismatthealthy — hub (Go + embedded SQLite on a PVC) and web (static SPA).
#
# Exposure model (repo ADR-0003): the hub has TWO listeners. Only the public
# read surface (8080) and the SPA are ever routed toward the internet; the
# LAN listener (8081: ingest + ops) stays on a .int host. When the Cloudflare
# Tunnel is added at launch, it points at the PUBLIC host only.

namespace: ismatthealthy

hub:
  image:
    repository: 192.168.2.17:5000/ismatthealthy-hub
    tag: 0.1.1
    pullPolicy: Always
  publicPort: 8080
  lanPort: 8081
  dbPath: /data/ismatthealthy.db

web:
  image:
    repository: 192.168.2.17:5000/ismatthealthy-web
    tag: 0.1.1
    pullPolicy: Always
  port: 80

persistence:
  size: 1Gi
  storageClass: local-path # single-node k3s; SQLite + network locks don't mix

ingress:
  class: traefik
  # public surface: SPA + /api (read-only), via the Cloudflare Tunnel.
  # Deliberately NO *.matthewpsimons.com hosts anywhere in this app — the
  # site's anonymity depends on zero DNS association with that domain
  # (2026-07-06 privacy audit). LAN viewing uses the public site.
  publicHosts:
    - ismatthealthy.com
  # LAN-only ingest + ops. .internal is the ICANN-reserved private-use TLD:
  # it cannot appear in public DNS. Clients resolve it via a hosts entry
  # (192.168.2.244). NEVER routed to the tunnel.
  lanHost: ingest.ismatthealthy.internal

# Litestream -> Cloudflare R2 (decision D8). Credentials: templates/
# r2-sealed-secret.yaml (sealed 2026-07-06).
litestream:
  enabled: true
  image: litestream/litestream:0.3
  bucket: ismatthealthy
  path: db
  endpoint: https://ff050bce9049f75029763393cb37f65e.r2.cloudflarestorage.com
  secretName: ismatthealthy-r2 # sealed secret: access-key-id / secret-access-key

resources: {}
