apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      initContainers:
        - name: wait-for-nas
          image: busybox
          command: ['sh', '-c', 'echo "Checking NAS mount..."; until mountpoint -q /host-mnt-nas; do echo "NAS not mounted, waiting..."; sleep 5; done; echo "NAS is mounted."']
          volumeMounts:
            - name: nas-check
              mountPath: /host-mnt-nas
              mountPropagation: HostToContainer
      containers:
        - name: transmission
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OPENVPN_PROVIDER
              value: "{{ .Values.openvpn.provider }}"
            - name: OPENVPN_CONFIG
              value: "{{ .Values.openvpn.config }}"
            - name: OPENVPN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sealedSecret.usernameSecretName }}
                  key: openvpn-username
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sealedSecret.passwordSecretName }}
                  key: openvpn-password
            - name: LOCAL_NETWORK
              value: "{{ .Values.openvpn.localNetwork }}"
            - name: PUID
              value: "{{ .Values.openvpn.puid }}"
            - name: PGID
              value: "{{ .Values.openvpn.pgid }}"
          ports:
            - containerPort: 9091
          volumeMounts:
            - mountPath: "{{ .Values.persistence.mountPath }}"
              name: data
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
        # Shares this pod's network namespace, and therefore the VPN tunnel (all traffic is routed via tun0).
        # It reports the public IP the world sees for this pod, so media-mcp can verify the VPN is up and
        # not leaking the home IP. If the tunnel is down the lookup fails and ip is empty.
        - name: vpn-ip
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              (while true; do
                ip=$(wget -qO- -T 10 http://api.ipify.org 2>/dev/null | tr -dc '0-9a-fA-F:.')
                printf '{"ip":"%s","checked_at":"%s"}\n' "$ip" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /www/ip.json.tmp && mv /www/ip.json.tmp /www/ip.json
                sleep 60
              done) &
              exec httpd -f -p 8082 -h /www
          ports:
            - name: vpn-ip
              containerPort: 8082
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          hostPath:
            path: "{{ .Values.persistence.path }}"
        - name: nas-check
          hostPath:
            path: /mnt/nas
