image:
  repository: kylemanna/openvpn
  tag: "latest"
  pullPolicy: IfNotPresent

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Persistent storage for configuration
persistence:
  enabled: true
  storageClass: "retain-default-storageclass"
  size: 100Mi
  accessMode: ReadWriteOnce

# VPN Service (LoadBalancer for MetalLB access)
service:
  type: LoadBalancer
  loadBalancerIP: "192.168.2.26"
  port: 443
  protocol: TCP

# OpenVPN Configuration
config:
  # External hostname for VPN server
  hostname: "vpn.matthewpsimons.com"
  # VPN subnet (internal network for VPN clients)
  vpnSubnet: "192.168.255.0"
  vpnNetmask: "255.255.255.0"
  # Protocol (udp or tcp)
  protocol: "tcp"
  # Port for VPN traffic
  port: 443

# Environment variables
env:
  TZ: "America/Chicago"

# Security context for OpenVPN requirements
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - MKNOD
      - NET_RAW
      - SYS_MODULE
      - SYS_NICE
  privileged: true
  runAsUser: 0  # Run as root for iptables access