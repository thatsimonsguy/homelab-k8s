image:
  repository: openvpn/openvpn-as
  tag: "2.13.1-d8cdeb9c-Ubuntu22"
  pullPolicy: IfNotPresent

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Persistent storage for configuration
persistence:
  enabled: true
  storageClass: "retain-default-storageclass"
  size: 100Mi
  accessMode: ReadWriteOnce

# VPN Service (LoadBalancer for direct MetalLB access)
service:
  vpn:
    type: LoadBalancer
    loadBalancerIP: "192.168.2.26"  # Next available MetalLB IP
    ports:
      tcp: 443
      udp: 1194

# Network configuration
network:
  # Use host networking for direct local access to admin UI
  hostNetwork: true
  # Admin UI will be accessible at host IP:943 (192.168.1.35:943)

# Admin UI Service (disabled when using host networking)
serviceAdmin:
  enabled: false
  type: ClusterIP
  port: 943

# Ingress configuration
ingress:
  # Admin UI ingress (disabled - using host network instead)
  admin:
    enabled: false
    host: matthewpsimons.com
    path: /vpn
    pathType: Prefix
    className: traefik

# OpenVPN Configuration
config:
  # VPN client network pool (5 addresses)
  vpnNetwork: "192.168.1.250"
  vpnNetmask: "255.255.255.248"  # /29 network for 5 usable IPs
  hostname: "vpn.matthewpsimons.com"

# Environment variables
env:
  TZ: "America/Chicago"

# Security context for OpenVPN requirements
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - MKNOD
  privileged: false

# Device access for /dev/net/tun
hostDevices:
  - name: tun
    path: /dev/net/tun