image:
  repository: openvpn/openvpn-as
  tag: "2.13.1-d8cdeb9c-Ubuntu22"
  pullPolicy: IfNotPresent

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Persistent storage for configuration
persistence:
  enabled: true
  storageClass: "retain-default-storageclass"
  size: 100Mi
  accessMode: ReadWriteOnce

# VPN Service (LoadBalancer for MetalLB access)
service:
  vpn:
    type: LoadBalancer
    loadBalancerIP: "192.168.2.26"
    ports:
      tcp: 443
      udp: 1194

# Admin UI Configuration
admin:
  enabled: true
  hostNetwork: true  # Direct access via 192.168.1.35:943

# OpenVPN Configuration
config:
  vpnNetwork: "192.168.1.250"
  vpnNetmask: "255.255.255.248"  # /29 network for 5 usable IPs
  hostname: "vpn.matthewpsimons.com"

# Environment variables
env:
  TZ: "America/Chicago"

# Security context for OpenVPN requirements
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - MKNOD
  privileged: false