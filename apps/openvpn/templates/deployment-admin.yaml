{{- if .Values.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvpn.fullname" . }}-admin
  labels:
    {{- include "openvpn.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openvpn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "openvpn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      hostNetwork: {{ .Values.admin.hostNetwork }}
      {{- if .Values.admin.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: openvpn-admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                {{- toYaml .Values.securityContext.capabilities.add | nindent 16 }}
            privileged: {{ .Values.securityContext.privileged }}
          ports:
            - name: admin-ui
              containerPort: 943
              protocol: TCP
              {{- if .Values.admin.hostNetwork }}
              hostPort: 943
              {{- end }}
          env:
            - name: TZ
              value: {{ .Values.env.TZ }}
          volumeMounts:
            - name: openvpn-data
              mountPath: /openvpn
            - name: tun-device
              mountPath: /dev/net/tun
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 943
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 943
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: openvpn-data
          persistentVolumeClaim:
            claimName: {{ include "openvpn.fullname" . }}-data
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      restartPolicy: Always
{{- end }}