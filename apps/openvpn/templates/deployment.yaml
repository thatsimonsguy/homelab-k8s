apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvpn.fullname" . }}
  labels:
    {{- include "openvpn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openvpn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openvpn.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: openvpn-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ['sh', '-c']
          args:
            - |
              if [ ! -f /etc/openvpn/ovpn_env.sh ]; then
                echo "Initializing OpenVPN configuration..."
                ovpn_genconfig -u {{ .Values.config.protocol }}://{{ .Values.config.hostname }}:{{ .Values.config.port }} -s {{ .Values.config.vpnSubnet }}/24
                echo "Configuration initialized"
              else
                echo "Configuration already exists, skipping initialization"
              fi
          volumeMounts:
            - name: openvpn-data
              mountPath: /etc/openvpn
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            privileged: true
      containers:
        - name: openvpn
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['ovpn_run']
          ports:
            - name: openvpn
              containerPort: {{ .Values.config.port }}
              protocol: {{ .Values.service.protocol }}
          env:
            - name: TZ
              value: {{ .Values.env.TZ }}
          volumeMounts:
            - name: openvpn-data
              mountPath: /etc/openvpn
            - name: tun-device
              mountPath: /dev/net/tun
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - MKNOD
            privileged: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "ps aux | grep '[o]vpn' || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.config.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: openvpn-data
          persistentVolumeClaim:
            claimName: {{ include "openvpn.fullname" . }}-data
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      restartPolicy: Always