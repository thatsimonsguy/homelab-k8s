# Entrypoint-level middlewares (referenced from the HelmChartConfig as
# kube-system-<name>@kubernetescrd). They sync before the HelmChartConfig
# (wave -1): an entrypoint that names a missing middleware fails every router
# on it, so the objects must exist before Traefik restarts with the new args.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-cf-connecting-ip
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  headers:
    customRequestHeaders:
      # An empty value removes the header.
      CF-Connecting-IP: ""
---
# On the tunnel entrypoint: Cloudflare terminated TLS (Always Use HTTPS), the
# hop cloudflared -> Traefik is plain HTTP, and Traefik does not trust
# cloudflared's X-Forwarded-* — so without this every upstream would see
# X-Forwarded-Proto: http. Keycloak (proxy-headers=xforwarded, backchannel
# dynamic) builds its back-channel endpoint URLs from it; erp-server's own
# discovery fetch of https://auth.quoinerp.com would otherwise get http://
# token/JWKS URLs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cftunnel-forwarded-proto
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      # The visitor reached Cloudflare on 443. Without this Traefik forwards the
      # tunnel hop's port (80), and Keycloak's dynamic back-channel URLs come out
      # as https://auth.quoinerp.com:80/... (token, certs), breaking code exchange.
      X-Forwarded-Port: "443"
