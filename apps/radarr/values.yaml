replicaCount: 1

image:
  repository: linuxserver/radarr
  tag: 6.2.1.10461-ls306
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7878

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: "retain-default-storageclass"
    dataPath: /config

volumes:
  movies:
    hostPath: /mnt/nas/movies
    mountPath: /movies
  downloads:
    hostPath: /mnt/nas/data/completed
    mountPath: /data/completed

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Etc/UTC"