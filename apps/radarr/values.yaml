replicaCount: 1

image:
  repository: linuxserver/radarr
  tag: 6.4.4.10685-ls320
  pullPolicy: IfNotPresent

service:
  # Direct LAN IP, not Traefik: the arrs treat any request carrying X-Forwarded-For
  # (which Traefik always adds) as non-local, which defeats "Disabled for Local Addresses".
  # Port 80 -> container port, so the hostname needs no :port.
  type: LoadBalancer
  port: 80
  loadBalancerIP: 192.168.2.31

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: "retain-default-storageclass"
    dataPath: /config

volumes:
  movies:
    hostPath: /mnt/nas/movies
    mountPath: /movies
  downloads:
    hostPath: /mnt/nas/data/completed
    mountPath: /data/completed

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Etc/UTC"