replicaCount: 1

image:
  repository: linuxserver/sonarr
  tag: 4.0.20.3014-ls328
  pullPolicy: IfNotPresent

service:
  # Direct LAN IP, not Traefik: the arrs treat any request carrying X-Forwarded-For
  # (which Traefik always adds) as non-local, which defeats "Disabled for Local Addresses".
  # Port 80 -> container port, so the hostname needs no :port.
  type: LoadBalancer
  port: 80
  loadBalancerIP: 192.168.2.30

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: "retain-default-storageclass"
    dataPath: /config

volumes:
  tv:
    hostPath: /mnt/nas/tv
    mountPath: /tv
  downloads:
    hostPath: /mnt/nas/data/completed
    mountPath: /data/completed

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Etc/UTC"