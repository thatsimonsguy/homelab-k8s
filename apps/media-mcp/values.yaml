replicaCount: 1

image:
  repository: 192.168.2.17:5000/media-mcp
  tag: 0.4.0
  pullPolicy: IfNotPresent

# LAN listener: no auth, direct MetalLB IP (not Traefik), port 80 -> 8080.
service:
  type: LoadBalancer
  port: 80
  loadBalancerIP: 192.168.2.32

# Cluster-internal addresses of the managed apps. API keys come from the
# media-mcp-secrets SealedSecret (SONARR_API_KEY, RADARR_API_KEY, JACKETT_API_KEY).
upstreams:
  sonarr: http://sonarr.sonarr.svc.cluster.local
  radarr: http://radarr.radarr.svc.cluster.local
  jackett: http://jackett.jackett.svc.cluster.local:9117
  transmission: http://transmission.default.svc.cluster.local:9091

# Public listener (per-person bearer tokens), reached through the Cloudflare tunnel
# via Traefik. Tokens are stored as SHA-256 hashes in the media-mcp-tokens SealedSecret.
public:
  enabled: true
  secretName: media-mcp-tokens
  host: media.matthewpsimons.com
  path: /mcp

# NAS recycle bin: ONLY the share's #recycle folder is mounted on the node at hostPath
# (a separate systemd mount, mnt-nas\x2drecycle.mount), so the pod can never see the rest of the NAS.
# The SMB mount is owned by uid/gid 1000, so the pod runs as 1000 to be able to empty it.
recycle:
  enabled: true
  hostPath: /mnt/nas-recycle
  mountPath: /recycle
  runAsUser: 1000

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
