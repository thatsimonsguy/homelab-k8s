apiVersion: batch/v1
kind: Job
metadata:
  name: traceroute-configure-purge-0-1-38
  namespace: traceroute
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: 192.168.2.17:5000/traceroute:0.1.38
          command: [traceroute-admin]
          args: [-operation, configure-purge-role, -purge-role, traceroute_workspace_purge]
          envFrom:
            - secretRef: {name: traceroute-migration}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
